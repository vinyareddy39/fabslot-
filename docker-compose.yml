services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fabslot-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: fabslot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: Uncomment below if you want a local MySQL container instead of TiDB Cloud
