spring.application.name=fabslot-backend

# All of these can be overridden by environment variables of the same name
# (Spring Boot's relaxed binding: SPRING_DATASOURCE_URL -> spring.datasource.url, etc.)
# Local defaults below are unchanged so nothing breaks for local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fabslot_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Honors the PORT env var that most cloud hosts (Railway, Render, Heroku) inject automatically
server.port=${PORT:8080}

# JWT
fabslot.jwt.secret=${FABSLOT_JWT_SECRET:ReplaceThisWithA256BitSecretKeyForFabSlotJwtSigningPurposesOnly}
fabslot.jwt.expiration-ms=86400000

# Comma-separated list of allowed frontend origins (deployed frontend URL goes here in production)
fabslot.cors.allowed-origins=${FABSLOT_CORS_ORIGINS:http://localhost:5173}
